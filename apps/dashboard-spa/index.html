<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guidezilla</title>
    <meta
      name="description"
      content="Manager surface for the AI Support Operations Platform."
    />
    <script>
      // No-flash theme boot: apply the stored preference before first paint.
      // Reads the same "theme" key as THEME_STORAGE_KEY in lib/theme.ts
      // (pinned by test/theme.test.ts); anything unrecognized follows the OS.
      try {
        var themePref = localStorage.getItem("theme");
        if (
          themePref === "dark" ||
          (themePref !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body class="min-h-screen bg-sidebar text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
