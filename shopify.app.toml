# Shopify app configuration for our OAuth connector — "connect your store →
# approve scopes", NOT an App Store listing. Committed so the app version
# (scopes, URLs, compliance webhooks) is version-controlled rather than living
# only in the Partner Dashboard. Link + push it with the Shopify CLI:
#
# DISTRIBUTION METHOD is a Partner/Dev Dashboard setting, not a field in this
# file — and it determines whether review is required:
#   * Pilot (one app per store, the current path): set the app to **Custom
#     distribution**. No Shopify review; protected customer data (Level 1 + 2,
#     i.e. the customer name/email/address on orders) is "always available"
#     — but you still DECLARE which PCD fields you use per app (see
#     [access_scopes] below + docs/shopify-pcd.md), and you cannot use the
#     Shopify Billing API.
#   * SaaS (one global app, many stores): would be **Public** distribution,
#     which DOES require Shopify review + a PCD attestation. "Unlisted" is a
#     Public sub-mode and is still review-gated — it is NOT the same as Custom
#     distribution. Do not conflate the two.
#
#
#   shopify app config link      # binds this file to the app, fills client_id
#   shopify app deploy           # releases this app version's config
#
# Two values are deployment-specific and MUST be set before linking:
#   * client_id        — the app's Client ID (Shopify API key) from the
#                        Partner Dashboard. `config link` writes it for you.
#   * the host in every URL below — the public base URL of apps/api (the same
#                        origin that serves /shopify/auth/callback and the
#                        /webhooks/shopify/* handlers). Replace
#                        `https://your-app-domain.example` throughout.
#
# Keep `[access_scopes].scopes` aligned with apps/api `DEFAULT_SHOPIFY_SCOPES`
# (the bootstrap test enforces tool→scope coverage).

client_id = "REPLACE_WITH_SHOPIFY_CLIENT_ID"
name = "Support Agent"
handle = "support-agent"
application_url = "https://your-app-domain.example/installed"

# Not embedded in Shopify Admin — by design. This is an OAuth connector with
# its own standalone surface (the /installed landing page + the WorkOS-auth
# dashboard), not an App-Store embedded app. Embedding / App Bridge is only
# required for listed embedded apps, which this is not. Keep `false`.
embedded = false

[access_scopes]
# read_orders     → shopify.get_order / findOrderByName       (PCD: Level 2)
# read_customers  → shopify.get_customer / searchByEmail       (PCD: Level 2)
# read_products   → shopify.get_product (damaged-product photo cross-check)
# write_orders    → refund.create, order.cancel (cancel + refund an unshipped
#                   order — same scope as refunds, no new scope required)
# write_discounts → discount.create (goodwill coupon codes). Not protected
#                   customer data; gated per-tenant by the discount policy.
#
# read_orders + read_customers expose protected customer data (Level 2 PII:
# customer name, email, address). On a Custom-distribution app these need NO
# Shopify review, but each app must still DECLARE the PCD fields it uses in its
# Dev Dashboard (Apps → API access → Protected customer data). The field set we
# justify is name + email + address — NOT phone. If a connected store returns
# orders with those fields blanked, the PCD declaration is missing. See
# docs/shopify-pcd.md for the per-field justifications and the per-app checklist.
#
# read_legal_policies → post-connect shop-policy import: reads the store's
# configured shipping + refund policies (shop.shopPolicies) and seeds the
# tenant knowledge base with them. Not protected customer data. Without this
# scope the import silently no-ops (best-effort), so the connect flow still
# succeeds — but the policies won't be imported until the scope is granted.
#
# read_online_store_pages → the same import job's page leg: seeds the
# knowledge base with the store's About / Contact / FAQ pages (conservative
# name match only). Not protected customer data. Same best-effort behavior —
# installs predating this scope skip the page leg until re-OAuth.
#
# read_locations → shopify.list_pickup_locations: customer pickup answers in
# the general-inquiry agent. The service filters to pickup-ENABLED locations
# only — private warehouses / 3PLs / dropship origins never surface. Not
# protected customer data. ALSO backs the dashboard refund modal's
# restock-location dropdown.
#
# read_inventory / write_inventory → the dashboard refund modal's restock leg:
# getOrderRefundContext reads the suggested restock location, and refundOrder
# restocks the returned units through refundCreate. Best-effort — an install
# without them still gets the refund modal, minus restocking, until re-OAuth.
#
# write_merchant_managed_fulfillment_orders / write_third_party_fulfillment_orders
# → supplier portal tracking edits via fulfillmentTrackingInfoUpdate, which
# accepts any ONE of Shopify's three fulfillment-order write scopes. We skip the
# third (`write_assigned_fulfillment_orders`): it is for apps registered as a
# Shopify fulfillment service, which this app is not. Shopify ALSO requires the
# installing/admin user to hold the `fulfill_and_ship_orders` user permission —
# that is a staff permission inside the merchant's admin, not an app scope, so
# no config here can grant it.
scopes = "read_orders,read_customers,read_products,write_orders,write_discounts,read_legal_policies,read_online_store_pages,read_locations,read_inventory,write_inventory,write_merchant_managed_fulfillment_orders,write_third_party_fulfillment_orders"

[auth]
redirect_urls = [
  "https://your-app-domain.example/shopify/auth/callback"
]

[webhooks]
api_version = "2026-04"

  # App lifecycle — the handler revokes the tenant's connector on uninstall.
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://your-app-domain.example/webhooks/shopify/app/uninstalled"

  # GDPR/CCPA compliance webhooks — required of any public app (listed or
  # not). Handlers already exist in apps/api (HMAC-verified); this block is
  # what registers them with Shopify.
  [webhooks.privacy_compliance]
  customer_data_request_url = "https://your-app-domain.example/webhooks/shopify/customers/data_request"
  customer_deletion_url = "https://your-app-domain.example/webhooks/shopify/customers/redact"
  shop_deletion_url = "https://your-app-domain.example/webhooks/shopify/shop/redact"

[pos]
embedded = false
